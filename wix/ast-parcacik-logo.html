<script>
(function(){
  // ---- AYARLAR ----
  const AYARLAR = {
    boyut: 0.86,          // logonun kutuya göre büyüklüğü (0.5 - 1)
    etkilesim: true,      // imleçle dağılma
    yaricap: 200,         // imlecin etki alanı (px)
    guc: 1,               // dağılma gücü
    ortamHareketi: 0.7,   // logonun kendi kendine hafif dalgalanması (0 = kapalı)
    girisAnimasyonu: true,// açılışta parçacıkların toplanması
    dinlenme: 'particles' // 'particles' = parçacık dokusu, 'image' = düz logo
  };
  // ------------------
  const root=document.getElementById('ast-fx'), img=document.getElementById('ast-fallback');
  let aspect=img.naturalWidth&&img.naturalHeight?img.naturalWidth/img.naturalHeight:1100/714, engine=null;
  function rect(){
    const w=root.clientWidth,h=root.clientHeight,bw=w*AYARLAR.boyut,bh=h*AYARLAR.boyut;
    let rw=bw, rh=bw/aspect; if(rh>bh){rh=bh;rw=bh*aspect;}
    return {x:(w-rw)/2,y:(h-rh)/2,w:rw,h:rh};
  }
  function relayout(){
    const r=rect();
    Object.assign(img.style,{left:r.x+'px',top:r.y+'px',width:r.w+'px',height:r.h+'px'});
    if(engine) engine.resize(root.clientWidth,root.clientHeight,r);
  }
  const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canvas=document.createElement('canvas'); root.insertBefore(canvas,img);
  try{
    engine=new LiquidEngine(canvas,{interactive:AYARLAR.etkilesim,strength:AYARLAR.guc,radius:AYARLAR.yaricap,density:1,dotSize:1,spread:1,
      turbulence:1,returnSpeed:1,streaks:true,restStyle:AYARLAR.dinlenme,ambient:AYARLAR.ortamHareketi>0,ambientIntensity:AYARLAR.ortamHareketi,
      speed:1,intro:AYARLAR.girisAnimasyonu,reducedMotion:rm,bg:[1,1,1],imgBg:null,liquid:1},()=>{root.dataset.gl='off';});
  }catch(e){root.dataset.gl='off';engine=null;}
  new ResizeObserver(relayout).observe(root);
  document.addEventListener('visibilitychange',()=>engine&&engine.setVisible(!document.hidden));
  const pos=e=>{const b=root.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top];};
  root.addEventListener('pointermove',e=>{const t=e.pointerType==='touch';if(t&&e.buttons===0&&e.pressure===0)return;const[x,y]=pos(e);engine&&engine.pointer('move',x,y,t);},{passive:true});
  root.addEventListener('pointerdown',e=>{const[x,y]=pos(e);engine&&engine.pointer('down',x,y,e.pointerType==='touch');},{passive:true});
  ['pointerup','pointercancel'].forEach(n=>root.addEventListener(n,e=>{const[x,y]=pos(e);engine&&engine.pointer('up',x,y,e.pointerType==='touch');},{passive:true}));
  root.addEventListener('pointerleave',e=>{const[x,y]=pos(e);engine&&engine.pointer('leave',x,y,e.pointerType==='touch');},{passive:true});
  function start(){
    aspect=img.naturalWidth/img.naturalHeight||aspect; relayout();
    if(engine&&root.dataset.gl!=='off'){try{engine.onFirstFrame=()=>{root.dataset.gl='on';};engine.setImage(img);relayout();}catch(e){root.dataset.gl='off';}}
  }
  if(img.complete&&img.naturalWidth) start(); else img.addEventListener('load',start,{once:true});
  relayout();
})();
