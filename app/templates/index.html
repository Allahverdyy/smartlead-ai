<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartLead AI · AST Digital</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --navy:#0F1B33; --mercan:#FF6B4A; --krem:#F2E9DA; --cizgi:#e2d6c3; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:Inter, sans-serif; background:var(--navy); color:var(--navy); min-height:100vh;
         display:flex; justify-content:center; align-items:center; padding:24px; }
  .kutu { width:100%; max-width:440px; height:660px; background:var(--krem); border-radius:20px; overflow:hidden;
          display:flex; flex-direction:column; box-shadow:0 24px 60px rgba(0,0,0,.4); }

  /* Üst bilgi */
  header { background:var(--navy); color:var(--krem); padding:14px 18px; display:flex; align-items:center; gap:12px;
           border-bottom:3px solid var(--mercan); }
  .avatar { width:40px; height:40px; border-radius:50%; background:var(--navy); border:2px solid var(--mercan);
            display:grid; place-items:center; flex-shrink:0; position:relative; }
  .avatar img { width:62%; }
  .avatar.kucuk { width:30px; height:30px; border-width:1.5px; }
  header .avatar::after { content:''; position:absolute; right:-1px; bottom:-1px; width:11px; height:11px;
                          background:#3ccf7a; border:2px solid var(--navy); border-radius:50%; }
  header h1 { font-family:Sora, sans-serif; font-size:16px; font-weight:700; }
  header p { font-size:12px; opacity:.7; margin-top:2px; }

  /* Mesajlar */
  #mesajlar { flex:1; overflow-y:auto; padding:18px 14px; display:flex; flex-direction:column; gap:12px; }
  .satir { display:flex; align-items:flex-end; gap:8px; animation:belir .35s ease-out; }
  .satir.sag { justify-content:flex-end; }
  @keyframes belir { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  .balon { max-width:78%; padding:10px 14px; border-radius:16px; font-size:14px; line-height:1.5; white-space:pre-wrap;
           word-break:break-word; }
  .bot { background:#fff; border-bottom-left-radius:4px; box-shadow:0 1px 2px rgba(15,27,51,.06); }
  .kullanici { background:var(--mercan); color:#fff; border-bottom-right-radius:4px; }
  .bilgi { align-self:center; font-size:12.5px; padding:8px 12px; border-radius:10px; animation:belir .35s ease-out; }
  .bilgi.hata { background:#ffe3dc; color:#a3301a; }
  .bilgi.basarili { background:#dff5e8; color:#1c6b40; }

  /* Yazıyor animasyonu */
  .yaziyor { display:flex; gap:4px; padding:14px 16px; }
  .yaziyor span { width:7px; height:7px; border-radius:50%; background:#b7a98f; animation:zipla 1.2s infinite ease-in-out; }
  .yaziyor span:nth-child(2) { animation-delay:.15s; }
  .yaziyor span:nth-child(3) { animation-delay:.3s; }
  @keyframes zipla { 0%,60%,100% { transform:translateY(0); opacity:.5; } 30% { transform:translateY(-5px); opacity:1; } }

  /* Dönüş formu */
  .donus { border-top:1px solid var(--cizgi); background:#fff8ef; }
  .donus-ac { width:100%; background:none; border:0; padding:11px 16px; font:600 13px Inter; color:var(--navy);
              cursor:pointer; display:flex; justify-content:space-between; align-items:center; }
  .donus-ac .ok { transition:transform .25s; color:var(--mercan); }
  .donus.acik .donus-ac .ok { transform:rotate(180deg); }
  #leadForm { display:grid; grid-template-columns:1fr 1fr; gap:8px 10px; padding:0 16px; max-height:0; overflow:hidden;
              transition:max-height .3s ease, padding .3s ease; }
  .donus.acik #leadForm { max-height:200px; padding:0 16px 14px; }
  label { font-size:11.5px; font-weight:600; color:#5b5446; display:flex; flex-direction:column; gap:4px; }
  #leadForm button { grid-column:1 / -1; }

  /* Ortak giriş ve buton */
  input { width:100%; padding:10px 12px; border:1px solid #d9ccb6; border-radius:10px; font:inherit; font-size:14px;
          background:#fff; color:var(--navy); outline:none; transition:border-color .2s; }
  input:focus { border-color:var(--mercan); }
  button.ana { background:var(--mercan); color:#fff; border:0; border-radius:10px; padding:10px 18px; font:600 14px Inter;
               cursor:pointer; transition:filter .2s, opacity .2s; }
  button.ana:hover { filter:brightness(1.07); }
  button.ana:disabled { opacity:.5; cursor:default; }
  #sohbetForm { display:flex; gap:8px; padding:12px; border-top:1px solid var(--cizgi); }
  #sohbetForm input { flex:1; }
{% if gomulu %}
  /* Wix popup'ı içinde: kenar boşluğu yok, pencere tüm alanı kaplar */
  body { padding:0; background:var(--navy); align-items:stretch; min-height:0; height:100vh; }
  .kutu { max-width:none; height:100vh; border-radius:0; box-shadow:none; }
  header { padding-right:56px; } /* Wix'in kapatma (X) düğmesine yer */
{% endif %}
</style>
</head>
<body>
<div class="kutu">
  <header>
    <div class="avatar"><img src="{{ url_for('static', filename='ast-sembol.svg') }}" alt="AST Digital"></div>
    <div>
      <h1>AST Digital Asistan</h1>
      <p>Çevrimiçi · Etsy mağazanız için buradayız</p>
    </div>
  </header>

  <div id="mesajlar"></div>

  <div class="donus" id="donus">
    <button class="donus-ac" id="donusAc" type="button">Size dönüş yapalım <span class="ok">▾</span></button>
    <form id="leadForm">
      <label>Ad Soyad
        <input id="isim" placeholder="Elif Kaya" maxlength="100" autocomplete="name" required minlength="2">
      </label>
      <label>Telefon
        <input id="telefon" type="tel" inputmode="tel" placeholder="05xx xxx xx xx" maxlength="17" autocomplete="tel" required>
      </label>
      <button class="ana">Beni arayın</button>
    </form>
  </div>

  <form id="sohbetForm">
    <input id="mesaj" placeholder="Mesajınızı yazın..." maxlength="1000" autocomplete="off">
    <button class="ana">Gönder</button>
  </form>
</div>

<script>
  const kutu = document.getElementById('mesajlar');
  const AVATAR = "{{ url_for('static', filename='ast-sembol.svg') }}";
  const gecmis = [];

  const bekle = (ms) => new Promise(r => setTimeout(r, ms));
  const asagiKaydir = () => kutu.scrollTop = kutu.scrollHeight;

  function avatarOlustur() {
    const a = document.createElement('div');
    a.className = 'avatar kucuk';
    const img = document.createElement('img');
    img.src = AVATAR; img.alt = '';
    a.appendChild(img);
    return a;
  }

  function mesajEkle(metin, kimden) {
    const satir = document.createElement('div');
    satir.className = 'satir' + (kimden === 'kullanici' ? ' sag' : '');
    if (kimden === 'bot') satir.appendChild(avatarOlustur());
    const b = document.createElement('div');
    b.className = 'balon ' + kimden;
    b.textContent = metin;                 // innerHTML değil: XSS'e karşı güvenli
    satir.appendChild(b);
    kutu.appendChild(satir);
    asagiKaydir();
  }

  function bilgiEkle(metin, tur) {
    const d = document.createElement('div');
    d.className = 'bilgi ' + tur;
    d.textContent = metin;
    kutu.appendChild(d);
    asagiKaydir();
  }

  function yaziyorGoster() {
    const satir = document.createElement('div');
    satir.className = 'satir';
    satir.appendChild(avatarOlustur());
    const b = document.createElement('div');
    b.className = 'balon bot yaziyor';
    b.innerHTML = '<span></span><span></span><span></span>';   // sabit içerik, kullanıcı verisi yok
    satir.appendChild(b);
    kutu.appendChild(satir);
    asagiKaydir();
    return satir;
  }

  // Açılış mesajı da kısa bir "yazıyor" ile gelsin
  (async () => {
    const y = yaziyorGoster();
    await bekle(1200);
    y.remove();
    mesajEkle('Merhaba! Ben AST Digital asistanıyım. Etsy mağazanızla ilgili ne sormak istersiniz?', 'bot');
  })();

  // Sohbet
  document.getElementById('sohbetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const giris = document.getElementById('mesaj');
    const buton = e.target.querySelector('button');
    const mesaj = giris.value.trim();
    if (!mesaj) return;

    mesajEkle(mesaj, 'kullanici');
    giris.value = '';
    giris.disabled = buton.disabled = true;

    await bekle(400);                      // kullanıcı mesajı yerleşsin, sonra "yazıyor" başlasın
    const yaziyor = yaziyorGoster();
    const enAzSure = 2000 + Math.random() * 2000;   // 2-4 sn; API daha uzun sürerse ek bekleme yok

    let veri;
    try {
      const [yanit] = await Promise.all([
        fetch('/api/sohbet', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ mesaj, gecmis })
        }),
        bekle(enAzSure)
      ]);
      veri = await yanit.json();
    } catch {
      veri = { basari: false, hata: 'Sunucuya ulaşılamadı. Lütfen tekrar deneyin.' };
    }

    yaziyor.remove();
    if (veri.basari) {
      mesajEkle(veri.cevap, 'bot');
      gecmis.push({role: 'user', content: mesaj}, {role: 'assistant', content: veri.cevap});
    } else {
      bilgiEkle(veri.hata, 'hata');
    }
    giris.disabled = buton.disabled = false;
    giris.focus();
  });

  // Dönüş formu aç/kapa
  const donus = document.getElementById('donus');
  document.getElementById('donusAc').addEventListener('click', () => {
    donus.classList.toggle('acik');
    if (donus.classList.contains('acik')) document.getElementById('isim').focus();
  });

  // Alanlara yalnızca izin verilen karakterler yazılabilsin (asıl kontrol sunucuda)
  function suz(id, izinsiz) {
    const alan = document.getElementById(id);
    alan.addEventListener('input', () => {
      const temiz = alan.value.replace(izinsiz, '');
      if (temiz !== alan.value) alan.value = temiz;
    });
  }
  suz('isim', /[^A-Za-zÇĞİÖŞÜçğıöşü .'-]/g);   // sadece harf, boşluk, . ' -
  suz('telefon', /[^0-9 +()-]/g);              // sadece rakam, boşluk, + ( ) -

  // Lead kaydı
  document.getElementById('leadForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const buton = e.target.querySelector('button');
    const isim = document.getElementById('isim').value.trim();
    const telefon = document.getElementById('telefon').value.trim();
    const kullaniciMesajlari = gecmis.filter(m => m.role === 'user').map(m => m.content);
    buton.disabled = true;
    try {
      const yanit = await fetch('/api/leads', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ isim, telefon, mesaj: kullaniciMesajlari.join(' | ') })
      });
      const veri = await yanit.json();
      if (veri.basari) {
        bilgiEkle('✓ ' + veri.mesaj, 'basarili');
        e.target.reset();
        donus.classList.remove('acik');
      } else {
        bilgiEkle(veri.hata, 'hata');
      }
    } catch {
      bilgiEkle('Sunucuya ulaşılamadı.', 'hata');
    }
    buton.disabled = false;
  });
</script>
</body>
</html>
