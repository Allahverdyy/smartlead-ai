<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yönetim Paneli · SmartLead AI</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --navy:#0F1B33; --navy2:#172644; --mercan:#FF6B4A; --krem:#F2E9DA; --kum:#FAF7F2; --gri:#4A5468; --cizgi:#E4D8C4; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:Inter, sans-serif; background:var(--kum); color:var(--navy); }

  /* Üst bant */
  .ust { background:var(--navy); color:var(--krem); padding:22px 32px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .ust img { width:40px; }
  .ust h1 { font-family:Sora, sans-serif; font-size:20px; flex:1; }
  .ust h1 small { display:block; font:400 12px Inter; opacity:.65; margin-top:2px; }
  .anahtar { display:flex; gap:8px; }
  .siteye { color:var(--krem); opacity:.75; font-size:13px; text-decoration:none; } .siteye:hover { opacity:1; }
  .ikincil { background:transparent; border:1px solid #2b3a5c; color:var(--krem); }
  .api { font-size:12px; display:flex; align-items:center; gap:6px; color:#9aa4b8; }
  .api i { width:9px; height:9px; border-radius:50%; background:#9aa4b8; display:inline-block; }
  .api.acik i { background:#3ccf7a; } .api.kapali i { background:var(--mercan); }
  .anahtar input { padding:9px 12px; border-radius:10px; border:1px solid #2b3a5c; background:var(--navy2); color:var(--krem); font:inherit; font-size:13px; width:230px; }
  button { background:var(--mercan); color:#fff; border:0; border-radius:10px; padding:9px 16px; font:600 13px Inter; cursor:pointer; }

  main { max-width:1080px; margin:0 auto; padding:28px 32px 60px; }

  /* KPI kartları */
  .kpiler { display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; margin-bottom:24px; }
  .kpi { background:#fff; border:1px solid var(--cizgi); border-radius:16px; padding:16px 18px; }
  .kpi b { display:block; font:700 28px Sora; }
  .kpi span { font-size:12px; color:var(--gri); text-transform:uppercase; letter-spacing:.06em; }
  .kpi.vurgu b { color:var(--mercan); }

  .sekmeler { display:flex; gap:8px; margin-bottom:18px; }
  .sekme { background:#fff; color:var(--navy); border:1px solid var(--cizgi); }
  .sekme.secili { background:var(--navy); color:var(--krem); border-color:var(--navy); }
  .sekme span { opacity:.7; font-weight:500; margin-left:4px; }
  .bas.anonim { background:var(--cizgi); color:var(--gri); }
  .etiket-lead { display:inline-block; background:var(--navy); color:var(--krem); border-radius:20px; padding:2px 9px; font-size:11px; font-weight:600; margin-left:8px; vertical-align:2px; }
  .arama { width:100%; padding:11px 14px; border:1px solid var(--cizgi); border-radius:12px; font:inherit; font-size:14px; margin-bottom:16px; background:#fff; }
  #durum { color:#a3301a; margin-bottom:12px; font-size:14px; }

  /* Lead kartı */
  .lead { background:#fff; border:1px solid var(--cizgi); border-radius:18px; margin-bottom:14px; overflow:hidden; }
  .lead-ust { display:flex; align-items:center; gap:14px; padding:16px 18px; cursor:pointer; }
  .bas { width:44px; height:44px; border-radius:50%; background:var(--navy); color:var(--krem); display:grid; place-items:center; font:700 15px Sora; flex-shrink:0; }
  .kim { flex:1; min-width:0; }
  .kim b { font:600 15px Sora; }
  .kim .alt { font-size:13px; color:var(--gri); margin-top:3px; display:flex; gap:14px; flex-wrap:wrap; }
  .kim a { color:var(--navy); text-decoration:none; border-bottom:1px dashed var(--cizgi); }
  .onizleme { font-size:13px; color:var(--gri); margin-top:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sag { text-align:right; font-size:12px; color:var(--gri); flex-shrink:0; }
  .rozet { display:inline-block; background:#fff1ec; color:var(--mercan); border-radius:20px; padding:3px 10px; font-weight:600; margin-top:6px; }
  .ok { transition:transform .25s; display:inline-block; margin-left:6px; color:var(--mercan); }
  .lead.acik .ok { transform:rotate(180deg); }

  /* Sohbet: sitedeki pencerenin "ekran görüntüsü" gibi */
  .sohbet-alan { display:none; padding:4px 18px 20px; }
  .lead.acik .sohbet-alan { display:block; }
  .pencere { max-width:440px; margin:0 auto; border-radius:18px; overflow:hidden; box-shadow:0 12px 30px rgba(15,27,51,.18); }
  .pencere-ust { background:var(--navy); color:var(--krem); padding:12px 16px; display:flex; align-items:center; gap:10px; border-bottom:3px solid var(--mercan); }
  .pencere-ust .av { width:30px; height:30px; border-radius:50%; border:1.5px solid var(--mercan); display:grid; place-items:center; }
  .pencere-ust .av img { width:62%; }
  .pencere-ust b { font:700 14px Sora; }
  .pencere-ust small { display:block; font-size:11px; opacity:.7; }
  .mesajlar { background:var(--krem); padding:14px 12px; display:flex; flex-direction:column; gap:10px; max-height:520px; overflow-y:auto; }
  .satir { display:flex; align-items:flex-end; gap:8px; }
  .satir.sag-taraf { justify-content:flex-end; }
  .satir .av { width:26px; height:26px; border-radius:50%; background:var(--navy); border:1.5px solid var(--mercan); display:grid; place-items:center; flex-shrink:0; }
  .satir .av img { width:62%; }
  .balon { max-width:80%; padding:9px 13px; border-radius:15px; font-size:13.5px; line-height:1.5; white-space:pre-wrap; word-break:break-word; }
  .bot { background:#fff; border-bottom-left-radius:4px; }
  .ziy { background:var(--mercan); color:#fff; border-bottom-right-radius:4px; }
  .bos { text-align:center; color:var(--gri); padding:50px 0; }
</style>
</head>
<body>
<div class="ust">
  <img src="{{ url_for('static', filename='ast-sembol.svg') }}" alt="AST Digital">
  <h1>Yönetim Paneli<small>SmartLead AI · potansiyel müşteriler ve sohbetleri</small></h1>
  <a href="/" class="siteye">← Siteye dön</a>
  <span class="api" id="api"><i></i>API kontrol ediliyor…</span>
  <div class="anahtar">
    <input id="anahtar" type="hidden">
    <button id="yenile">Yenile</button>
    <button id="csv" class="ikincil" title="Açık sekmedeki kayıtları indir">CSV indir</button>
    <button id="cikis" class="ikincil" title="Yönetici oturumunu kapat">Çıkış</button>
  </div>
</div>

<main>
  <div class="sekmeler">
    <button class="sekme secili" data-sekme="leadler">Potansiyel müşteriler<span id="sLead"></span></button>
    <button class="sekme" data-sekme="sohbetler">Tüm sohbetler<span id="sSohbet"></span></button>
  </div>
  <div class="kpiler">
    <div class="kpi"><b id="k1">–</b><span id="k1a">Toplam lead</span></div>
    <div class="kpi vurgu"><b id="k2">–</b><span>Bugün</span></div>
    <div class="kpi"><b id="k3">–</b><span id="k3a">Son 7 gün</span></div>
  </div>
  <input class="arama" id="arama" placeholder="İsim, telefon, e-posta veya sohbet içinde ara…">
  <div id="durum"></div>
  <div id="liste"></div>
</main>

<script>
  const SEMBOL = "{{ url_for('static', filename='ast-sembol.svg') }}";
  let veriler = { leadler: [], sohbetler: [] };
  let sekme = 'leadler';
  // Kayıtlı dökümü mesajlara çevirir. "Ziyaretçi:" / "Asistan:" ile başlamayan satır, önceki mesajın devamıdır.
  function sohbetiAyristir(metin) {
    const mesajlar = [];
    for (const satir of (metin || '').split('\n')) {
      const m = satir.match(/^(Ziyaretçi|Asistan):\s?(.*)$/);
      if (m) mesajlar.push({ kim: m[1] === 'Asistan' ? 'bot' : 'ziy', metin: m[2] });
      else if (mesajlar.length) mesajlar[mesajlar.length - 1].metin += '\n' + satir;
      else if (satir.trim()) satir.split(' | ').forEach(p => p.trim() && mesajlar.push({ kim: 'ziy', metin: p.trim() }));   // eski kayıtlar
    }
    return mesajlar;
  }

  const el = (etiket, sinif, metin) => { const e = document.createElement(etiket); if (sinif) e.className = sinif; if (metin !== undefined) e.textContent = metin; return e; };
  const avatar = () => { const a = el('div', 'av'); const i = document.createElement('img'); i.src = SEMBOL; i.alt = ''; a.appendChild(i); return a; };
  const basHarf = (isim) => isim.split(' ').slice(0, 2).map(k => k[0] ? k[0].toLocaleUpperCase('tr') : '').join('');
  const tarihYaz = (t) => { const d = new Date(t.replace(' ', 'T')); return isNaN(d) ? t : d.toLocaleString('tr-TR', { day:'numeric', month:'long', hour:'2-digit', minute:'2-digit' }); };

  // Lead ve sohbet kayıtlarını aynı kart biçimine çevirir
  function kayitBicimle(r, sira) {
    if (sekme === 'leadler') return { isim: r.isim, telefon: r.telefon, eposta: r.eposta, etsy: r.etsy_magaza, mesaj: r.mesaj, tarih: r.tarih, lead: false };
    const isim = r.isim || r.z_isim;
    return { isim: isim || ('Ziyaretçi #' + sira), anonim: !isim, telefon: r.telefon, eposta: r.eposta || r.z_eposta,
             mesaj: r.dokum, tarih: r.son_tarih, lead: !!r.lead_id };
  }

  function kart(l) {
    const mesajlar = sohbetiAyristir(l.mesaj);
    const k = el('div', 'lead');
    const ust = el('div', 'lead-ust');
    ust.appendChild(el('div', 'bas' + (l.anonim ? ' anonim' : ''), l.anonim ? '?' : basHarf(l.isim)));

    const kim = el('div', 'kim');
    const ad = el('b', '', l.isim);
    kim.appendChild(ad);
    if (l.lead) kim.appendChild(el('span', 'etiket-lead', 'Lead'));
    const alt = el('div', 'alt');
    if (l.telefon) { const tel = el('a', '', l.telefon); tel.href = 'tel:' + l.telefon; tel.onclick = (e) => e.stopPropagation(); alt.appendChild(tel); }
    if (l.eposta) { const m = el('a', '', l.eposta); m.href = 'mailto:' + l.eposta; m.onclick = (e) => e.stopPropagation(); alt.appendChild(m); }
    if (!l.telefon && !l.eposta) alt.appendChild(el('span', '', 'İletişim bilgisi bırakmadı'));
    if (l.etsy) alt.appendChild(el('span', '', '🛍 ' + l.etsy));
    kim.appendChild(alt);
    const sonZiy = [...mesajlar].reverse().find(m => m.kim === 'ziy');
    kim.appendChild(el('div', 'onizleme', sonZiy ? '“' + sonZiy.metin + '”' : 'Sohbet kaydı yok'));
    ust.appendChild(kim);

    const sag = el('div', 'sag', tarihYaz(l.tarih));
    sag.appendChild(document.createElement('br'));
    const rozet = el('span', 'rozet', mesajlar.length + ' mesaj');
    rozet.appendChild(el('span', 'ok', '▾'));
    sag.appendChild(rozet);
    ust.appendChild(sag);
    k.appendChild(ust);

    // Sohbet penceresi: sitedeki pencerenin "ekran görüntüsü" gibi
    const alan = el('div', 'sohbet-alan');
    const pen = el('div', 'pencere');
    const pu = el('div', 'pencere-ust'); pu.appendChild(avatar());
    const pb = el('div'); pb.appendChild(el('b', '', 'AST Digital Asistan')); pb.appendChild(el('small', '', l.isim + ' ile sohbet · ' + tarihYaz(l.tarih)));
    pu.appendChild(pb); pen.appendChild(pu);
    const ml = el('div', 'mesajlar');
    if (!mesajlar.length) ml.appendChild(el('div', 'bos', 'Bu kayıtta sohbet yok.'));
    for (const m of mesajlar) {
      const s = el('div', 'satir' + (m.kim === 'ziy' ? ' sag-taraf' : ''));
      if (m.kim === 'bot') s.appendChild(avatar());
      s.appendChild(el('div', 'balon ' + m.kim, m.metin));   // textContent: XSS'e karşı güvenli
      ml.appendChild(s);
    }
    pen.appendChild(ml); alan.appendChild(pen); k.appendChild(alan);
    ust.addEventListener('click', () => k.classList.toggle('acik'));
    return k;
  }

  function goster() {
    const q = document.getElementById('arama').value.toLocaleLowerCase('tr').trim();
    const liste = document.getElementById('liste'); liste.innerHTML = '';
    const ham = veriler[sekme];
    const kayitlar = ham.map((r, i) => kayitBicimle(r, ham.length - i))
      .filter(l => !q || [l.isim, l.telefon || '', l.eposta || '', l.mesaj || '', l.etsy || ''].join(' ').toLocaleLowerCase('tr').includes(q));
    if (!kayitlar.length) { liste.appendChild(el('div', 'bos', 'Gösterilecek kayıt yok.')); return; }
    kayitlar.forEach(l => liste.appendChild(kart(l)));
  }

  function kpiGuncelle() {
    const simdi = new Date(), bugun = simdi.toDateString();
    const d = (t) => new Date((t || '').replace(' ', 'T'));
    const L = veriler.leadler, S = veriler.sohbetler;
    document.getElementById('sLead').textContent = L.length;
    document.getElementById('sSohbet').textContent = S.length;
    if (sekme === 'leadler') {
      document.getElementById('k1a').textContent = 'Toplam lead';
      document.getElementById('k3a').textContent = 'Son 7 gün';
      document.getElementById('k1').textContent = L.length;
      document.getElementById('k2').textContent = L.filter(l => d(l.tarih).toDateString() === bugun).length;
      document.getElementById('k3').textContent = L.filter(l => simdi - d(l.tarih) < 7 * 864e5).length;
    } else {
      document.getElementById('k1a').textContent = 'Toplam sohbet';
      document.getElementById('k3a').textContent = 'Lead\'e dönüşen';
      document.getElementById('k1').textContent = S.length;
      document.getElementById('k2').textContent = S.filter(s => d(s.son_tarih).toDateString() === bugun).length;
      document.getElementById('k3').textContent = S.length ? S.filter(s => s.lead_id).length + ' (%' + Math.round(100 * S.filter(s => s.lead_id).length / S.length) + ')' : '0';
    }
  }

  async function yukle() {
    const durum = document.getElementById('durum'); durum.textContent = '';
    const basliklar = { headers: { 'X-Admin-Key': document.getElementById('anahtar').value } };
    try {
      const [a, b] = await Promise.all([fetch('/api/leads', basliklar), fetch('/api/sohbetler', basliklar)]);
      const [va, vb] = await Promise.all([a.json(), b.json()]);
      if (a.status === 401) { girisEkraninaDon(); return; }
      if (!va.basari) { durum.textContent = va.hata; return; }
      veriler = { leadler: va.leadler, sohbetler: vb.basari ? vb.sohbetler : [] };
      kpiGuncelle(); goster();
    } catch { durum.textContent = 'Sunucuya ulaşılamadı.'; }
  }

  document.querySelectorAll('.sekme').forEach(b => b.addEventListener('click', () => {
    sekme = b.dataset.sekme;
    document.querySelectorAll('.sekme').forEach(x => x.classList.toggle('secili', x === b));
    kpiGuncelle(); goster();
  }));
  document.getElementById('arama').addEventListener('input', goster);
  document.getElementById('yenile').addEventListener('click', yukle);

  // Açık sekmedeki (aramaya uyan) kayıtları Excel'in açabileceği CSV olarak indirir
  document.getElementById('csv').addEventListener('click', () => {
    const q = document.getElementById('arama').value.toLocaleLowerCase('tr').trim();
    const ham = veriler[sekme];
    const kayitlar = ham.map((r, i) => kayitBicimle(r, ham.length - i))
      .filter(l => !q || [l.isim, l.telefon || '', l.eposta || '', l.mesaj || '', l.etsy || ''].join(' ').toLocaleLowerCase('tr').includes(q));
    const hucre = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const satirlar = [['Ad', 'Telefon', 'E-posta', 'Etsy mağazası', 'Tarih', 'Lead mi', 'Sohbet']]
      .concat(kayitlar.map(l => [l.isim, l.telefon, l.eposta, l.etsy, l.tarih, (sekme === 'leadler' || l.lead) ? 'Evet' : 'Hayır', l.mesaj]));
    const csv = '\ufeff' + satirlar.map(s => s.map(hucre).join(';')).join('\r\n');   // BOM + ';' : Türkçe Excel doğru açar
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = `smartlead-${sekme}-${new Date().toISOString().slice(0, 10)}.csv`;
    a.click(); URL.revokeObjectURL(a.href);
  });

  // Sunucu ayakta mı? (Render uykudaysa ilk istek ~1 dk sürebilir)
  (async () => {
    const api = document.getElementById('api');
    try {
      const v = await fetch('/health').then(r => r.json());
      api.className = 'api ' + (v.durum === 'aktif' ? 'acik' : 'kapali');
      api.lastChild.textContent = v.durum === 'aktif' ? 'API çalışıyor' : 'API yanıt vermiyor';
    } catch { api.className = 'api kapali'; api.lastChild.textContent = 'API yanıt vermiyor'; }
  })();
  // Panel yalnızca sitedeki "Yönetim Paneli" girişinden açılır; anahtar o oturumda saklanır
  function girisEkraninaDon() { try { sessionStorage.removeItem('ast_admin_key'); } catch (_) {} location.replace('/#yonetim'); }
  document.getElementById('cikis').addEventListener('click', girisEkraninaDon);
  let kayitliAnahtar = null;
  try { kayitliAnahtar = sessionStorage.getItem('ast_admin_key'); } catch (_) {}
  if (kayitliAnahtar === null) { girisEkraninaDon(); }
  else { document.getElementById('anahtar').value = kayitliAnahtar; yukle(); }
</script>
</body>
</html>
